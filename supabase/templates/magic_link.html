<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f6f4ef;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#15171f">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
      <tr>
        <td>
          <p style="margin:0 0 8px;font-size:22px;font-weight:800;letter-spacing:-0.02em">Nextto<span style="color:#ff5a36">.</span></p>
          <p style="margin:0 0 24px;color:#5b5f6b">You're next.</p>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5">Tap the button below to sign in. The link works once and expires in an hour.</p>
          <p style="margin:0 0 24px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}" style="display:inline-block;background:#ff5a36;color:#ffffff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:999px">Sign in to Nextto</a>
          </p>
          <p style="margin:0;color:#5b5f6b;font-size:13px">Or enter this code: <strong>{{ .Token }}</strong><br />If you didn't ask for this, you can ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
