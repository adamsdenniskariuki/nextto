name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Database (migrations, lint, pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check migration file names
        shell: bash
        run: |
          # Every migration must be <14-digit timestamp>_<snake_case>.sql so
          # the order is unambiguous.
          bad=$(ls supabase/migrations | grep -Ev '^[0-9]{14}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then echo "Badly named migrations:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (pins the Supabase CLI version)
        run: npm ci

      # Starts only Postgres, then applies every migration and seed.sql from
      # scratch. A broken migration fails here.
      - name: Start Postgres and apply migrations + seed
        run: npx supabase db start

      - name: Re-apply from scratch (migration reset check)
        run: npx supabase db reset

      - name: Lint database schema
        run: npm run db:lint

      - name: pgTAP and RLS tests
        run: npm run db:test

      - name: Stop
        if: always()
        run: npx supabase stop --no-backup

  web:
    name: Web (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build only needs well-formed public values.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright against local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Auth (GoTrue), REST, Realtime and Mailpit are needed; skip the rest.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/lib/database.types.ts || {
            echo "::error::src/lib/database.types.ts is stale. Run 'npm run db:types' and commit."; exit 1; }

      - name: Point the app at local Supabase
        shell: bash
        run: |
          eval "$(npx supabase status -o env 2>/dev/null)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "MAILPIT_URL=${MAILPIT_URL:-http://127.0.0.1:54324}"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            # Mock M-Pesa: no Safaricom credentials in CI; the app calls its own
            # callback route, so the whole callback path is still exercised.
            echo "MPESA_ENV=mock"
            echo "MPESA_CALLBACK_SECRET=ci-callback-secret"
          } >> "$GITHUB_ENV"

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop
        if: always()
        run: npx supabase stop --no-backup
