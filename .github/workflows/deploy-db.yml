name: Deploy database

# Applies new migrations in supabase/migrations to the cloud project. It runs
# after a merge to main that touches migrations, or by hand from the Actions
# tab. Until the three secrets (docs/SETUP.md §8) are set it skips cleanly, so
# forks and fresh clones stay green.

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false # never interrupt a migration half way

permissions:
  contents: read

jobs:
  push:
    name: supabase db push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check secrets
        id: secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase secrets are not set; skipping the migration deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - if: steps.secrets.outputs.ready == 'true'
        name: Install dependencies (pins the Supabase CLI version)
        run: npm ci

      - if: steps.secrets.outputs.ready == 'true'
        name: Link the project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - if: steps.secrets.outputs.ready == 'true'
        name: Show pending migrations
        run: npx supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - if: steps.secrets.outputs.ready == 'true'
        name: Apply migrations (never the seed)
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"
